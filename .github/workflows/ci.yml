name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.platform }}
        run: >
          xcodebuild build
          -scheme FontBlaster
          -destination 'generic/platform=${{ matrix.platform }}'
          CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: >
          xcodebuild test
          -scheme FontBlaster
          -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES
